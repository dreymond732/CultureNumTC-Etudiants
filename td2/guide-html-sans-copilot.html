<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Le titre de l'onglet n'est pas le titre visible dans la page. -->
  <title>Découvrir quelques balises HTML</title>
</head>
<body>
  <!-- h1 désigne le titre principal visible du document. -->
  <h1>Mon premier aperçu du HTML</h1>

  <!-- p sert à écrire un paragraphe. -->
  <p>Cette page a été fournie pour les étudiants qui n'utilisent pas Copilot.</p>

  <!-- strong marque un passage important. -->
  <p><strong>À retenir :</strong> le navigateur affiche un document interprété.</p>

  <!-- ul et li organisent une liste non numérotée. -->
  <ul>
    <li>Observer le texte source dans Codespaces.</li>
    <li>Comparer l'affichage avec le navigateur.</li>
  </ul>

  <!-- Complétez ici, dans votre copie guide-html.html,
       un commentaire qui explique le rôle d'un lien HTML. -->
  <p>Documentation : <a href="https://www.w3.org/">W3C</a></p>
</body>
</html>
